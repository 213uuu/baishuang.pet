name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile
        run: python -m py_compile desktop_pet.py bubble_shape.py pet-tray.py

      - name: Test
        run: python -m unittest discover -s tests -v
